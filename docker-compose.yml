# Utopp Plataforma. Este proyecto es dueño del contenedor de Postgres, que
# comparte con Utopp Formulario a través del network externo 'utopp_default'.
#
# Antes del primer 'docker compose up', crear el network una sola vez:
#   docker network create utopp_default
#
# Con el network ya creado, los dos proyectos pueden levantarse en cualquier
# orden. Postgres es alcanzable como 'db' desde ambos.
services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      utopp_default:
        aliases:
          - db
  backend:
    build: ./Backend
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./Backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    networks:
      - utopp_default
  frontend:
    build: ./Frontend/mi-app
    env_file: .env
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./Frontend/mi-app:/app # lo que escribes en tu máquina aparece instantáneamente dentro del contenedor
      - /app/node_modules # Protege los node_modules instalados dentro del contenedor
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - utopp_default
  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@utopp.com   # Correo de acceso a pgAdmin
  #     PGADMIN_DEFAULT_PASSWORD: admin           # Contraseña de acceso a pgAdmin
  #   ports:
  #     - "5050:80"   # Acceder en http://localhost:5050
  #   depends_on:
  #     - db
volumes:
  pgdata:
networks:
  utopp_default:
    name: utopp_default
    external: true
